<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern DoorKing Interface</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚪 DoorKing 1830 Control Panel</h1>
            <div class="connection-status">
                <span id="status-indicator" class="status-dot disconnected"></span>
                <span id="status-text">Disconnected</span>
            </div>
        </header>

        <main>
            <!-- Connection Section -->
            <section class="card">
                <h2>Connection</h2>
                <div class="button-group">
                    <button id="btn-connect" class="btn btn-primary">Connect to Device</button>
                    <button id="btn-disconnect" class="btn btn-secondary" disabled>Disconnect</button>
                </div>
                <div id="connection-info" class="info-box" style="display: none;">
                    <p><strong>Status:</strong> <span id="conn-status">-</span></p>
                    <p><strong>Connected At:</strong> <span id="conn-time">-</span></p>
                </div>
            </section>

            <!-- Door Control Section -->
            <section class="card">
                <h2>Door Control</h2>
                <div class="door-controls">
                    <button id="btn-open-door" class="btn btn-success" disabled>
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="9" y1="3" x2="9" y2="21"></line>
                        </svg>
                        Open Door
                    </button>
                    <button id="btn-lock-door" class="btn btn-warning" disabled>
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        Lock Door
                    </button>
                    <button id="btn-unlock-door" class="btn btn-info" disabled>
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
                        </svg>
                        Unlock Door
                    </button>
                </div>
                <div id="door-status" class="info-box" style="display: none;">
                    <p><strong>Door State:</strong> <span id="door-state">-</span></p>
                    <p><strong>Locked:</strong> <span id="door-locked">-</span></p>
                </div>
            </section>

            <!-- Access Code Management -->
            <section class="card">
                <h2>Access Code Management</h2>
                <div class="form-group">
                    <input type="text" id="code-input" placeholder="Access Code" maxlength="10">
                    <input type="text" id="name-input" placeholder="Name (optional)">
                    <input type="text" id="unit-input" placeholder="Unit (optional)">
                    <div class="button-group">
                        <button id="btn-add-code" class="btn btn-primary" disabled>Add Code</button>
                        <button id="btn-list-codes" class="btn btn-secondary" disabled>List Codes</button>
                    </div>
                </div>
                <div id="codes-list" class="list-container"></div>
            </section>

            <!-- Access Logs -->
            <section class="card">
                <h2>Access Logs</h2>
                <div class="button-group">
                    <button id="btn-refresh-logs" class="btn btn-secondary" disabled>Refresh Logs</button>
                    <select id="log-count">
                        <option value="50">Last 50</option>
                        <option value="100" selected>Last 100</option>
                        <option value="200">Last 200</option>
                    </select>
                </div>
                <div id="logs-list" class="list-container"></div>
            </section>

            <!-- System Information -->
            <section class="card">
                <h2>System Information</h2>
                <button id="btn-system-info" class="btn btn-secondary" disabled>Get System Info</button>
                <div id="system-info" class="info-box" style="display: none;">
                    <p><strong>Model:</strong> <span id="sys-model">-</span></p>
                    <p><strong>Version:</strong> <span id="sys-version">-</span></p>
                    <p><strong>Serial Number:</strong> <span id="sys-serial">-</span></p>
                    <p><strong>Uptime:</strong> <span id="sys-uptime">-</span></p>
                </div>
            </section>

            <!-- Activity Log -->
            <section class="card">
                <h2>Activity Log</h2>
                <div id="activity-log" class="activity-log"></div>
            </section>
        </main>

        <footer>
            <p>Modern DoorKing Interface &copy; 2025</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
